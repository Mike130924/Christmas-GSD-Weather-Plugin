name: Extract Android Project ZIP into Repository Root

on:
  workflow_dispatch:
  push:
    paths:
      - 'Christmas-GSD-Weather-Plugin-v0.5.2-TV-Settings-Fixes-Source.zip'

permissions:
  contents: write

concurrency:
  group: extract-android-project
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Christmas-GSD-Weather-Plugin-v0.5.2-TV-Settings-Fixes-Source.zip"

          test -f "$ARCHIVE"
          mkdir -p _project_extract
          unzip -q "$ARCHIVE" -d _project_extract

          if [ -f "_project_extract/settings.gradle.kts" ]; then
            ROOT="_project_extract"
          elif [ -f "_project_extract/Christmas GSD Weather Plugin/settings.gradle.kts" ]; then
            ROOT="_project_extract/Christmas GSD Weather Plugin"
          else
            echo "Android project root not found in ZIP."
            find _project_extract -maxdepth 3 -type f | head -50
            exit 1
          fi

          test -f "$ROOT/settings.gradle.kts"
          test -d "$ROOT/app"
          test -d "$ROOT/api"

          rm -rf "$ROOT/.github"

          cp -a "$ROOT"/. .

          rm -rf _project_extract

          test -f settings.gradle.kts
          test -d app
          test -d api

      - name: Commit extracted Android project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes detected."
            exit 0
          fi

          git commit -m "Apply v0.5.2 Android project source"

          git push origin HEAD:main
