
name: Christmas GSD Weather Plugin - Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Decode permanent release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || (echo 'Missing RELEASE_KEYSTORE_BASE64 GitHub Secret' && exit 1)
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/christmas-gsd-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/christmas-gsd-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || (echo 'Missing RELEASE_KEYSTORE_PASSWORD GitHub Secret' && exit 1)
          test -n "$RELEASE_KEY_ALIAS" || (echo 'Missing RELEASE_KEY_ALIAS GitHub Secret' && exit 1)
          test -n "$RELEASE_KEY_PASSWORD" || (echo 'Missing RELEASE_KEY_PASSWORD GitHub Secret' && exit 1)
          gradle :app:assembleRelease --stacktrace

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/release/Christmas-GSD-Weather-Plugin.apk

      - name: Rename debug APK
        if: github.event_name == 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Christmas-GSD-Weather-Plugin.apk

      - name: Upload release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-GSD-Weather-Plugin-Release-APK
          path: app/build/outputs/apk/release/Christmas-GSD-Weather-Plugin.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Christmas-GSD-Weather-Plugin-Debug-APK
          path: app/build/outputs/apk/debug/Christmas-GSD-Weather-Plugin.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Christmas-GSD-Weather-Plugin.apk
          generate_release_notes: true
